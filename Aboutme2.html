<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>

    <style>
        body {
            margin: 0;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* กรอบด้านนอก */
        .card {
            width: 440px;
            height: 677px;
            background-color: #f8e9d4;
            border: 40px solid #ed6500;
            border-radius: 17px;
            box-sizing: border-box;
            text-align: center;
        }

        /* รหัสนักศึกษา */
        .id {
            font-family: "Times New Roman", serif;
            font-size: 18px;
            font-weight: bold;
            margin-top: 36px;
            margin-bottom: 15px;
        }

        /* รูปภาพ */
        .profile {
            width: 250px;
            height: 320px;
            object-fit: cover;
            border: 4px solid #00d639;
            border-radius: 50%;
            display: block;
            margin: 0 auto;
        }

        /* ชื่อ */
        h1 {
            width: 320px;
            height: 36px;
            box-sizing: border-box;
            margin: 20px auto 15px auto;

            background-color: #f4b7f3;
            border: 1px solid #8a00ff;
            border-radius: 20px;

            color: #ff00e6;
            font-size: 25px;
            line-height: 34px;
            font-family: "Tahoma", sans-serif;
        }

        /* ข้อความ */
        p {
            margin: 14px 0;
            font-size: 16px;
            font-weight: bold;
            font-family: "Tahoma", sans-serif;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="id">
            ID:056950405240-2
        </div>

        <img src="nirunj.jpg" class="profile" alt="รูปของฉัน">

        <h1>นาย นิรันดร์ ดีได้</h1>

        <p>สาขาวิศวกรรมคอมพิวเตอร์</p>

        <p>คณะวิศวกรรมศาสตร์</p>

        <p>มหาวิทยาลัยเทคโนโลยีราชมงคลพระนคร</p>

    </div>

</body>

</html>
